name: Deploy backend to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: 570fa062-9220-4006-ba28-13497fa9530b
          tenant-id: 3a1e98aa-47a1-4f06-a7b2-d637aae4c6c3
          subscription-id: 6521a782-db45-4384-90fd-905468b25598

      - name: Build and deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: proj001-app
